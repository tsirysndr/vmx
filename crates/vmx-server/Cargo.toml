[package]
name = "vmx-server"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.12.0"
anyhow = "1.0.100"
awc = "3.5.2"
chrono = "0.4.42"
cuid2 = "0.1.4"
dashmap = "6.1.0"
dirs = "6.0.0"
dotenv = "0.15.0"
http = "1.4.0"
jacquard = "0.9.3"
jacquard-oauth = { version = "0.9.2", features = ["tracing"] }
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
oauth2 = "5.0.0"
rand = "0.9.2"
reqwest = { version = "0.12.24", features = [
  "rustls-tls",
  "json",
], default-features = false }
rust-embed = { version = "8.9.0", features = ["debug-embed", "actix"] }
serde = "1.0"
serde_html_form = "0.2.8"
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "derive", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
unicode-segmentation = "1.12.0"
url = "2.5.7"
vmx-lexicons = { path = "../vmx-lexicons" }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
