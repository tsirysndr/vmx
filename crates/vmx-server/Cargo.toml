[package]
name = "vmx-server"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
actix = "0.13.5"
actix-cors = "0.7.1"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.12.0"
anyhow = "1.0.100"
atrium-api = "0.25.6"
atrium-common = "0.1.2"
atrium-identity = "0.1.7"
atrium-oauth = "0.1.5"
awc = "3.5.2"
chrono = "0.4.42"
dirs = "6.0.0"
hickory-resolver = "0.25.2"
mime_guess = "2.0.5"
oauth2 = "5.0.0"
rand = "0.9.2"
rust-embed = { version = "8.9.0", features = ["debug-embed", "actix"] }
serde = "1.0"
serde_json = "1.0"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "tls-rustls", "sqlite", "chrono", "derive", "macros"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
